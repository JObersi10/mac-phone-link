syntax = "proto3";
package maclink.sidechannel.v1;

enum WakeResponseStatus {
  WAKE_RESPONSE_STATUS_UNSPECIFIED = 0;
  WAKE_RESPONSE_STATUS_SUCCESS = 1;
  WAKE_RESPONSE_STATUS_ERROR_OTHER = 2;
  WAKE_RESPONSE_STATUS_NO_INTERNET = 3;
  WAKE_RESPONSE_STATUS_NETWORK_ERROR = 4;
  WAKE_RESPONSE_STATUS_WEB_SERVICE_ERROR = 5;
  WAKE_RESPONSE_STATUS_WEB_SERVICE_CIRCUIT_BREAKER = 6;
  WAKE_RESPONSE_STATUS_UNTRUSTED = 7;
  WAKE_RESPONSE_STATUS_MSA_ISSUE = 8;
  WAKE_RESPONSE_STATUS_FEATURE_DISABLED = 9;
}

message WakeRequest {}

message WakeResponse {
  WakeResponseStatus status = 1;
}
