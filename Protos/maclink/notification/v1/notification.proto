// Clean-room interoperability schema for the mac-phone-link project.
// Independently authored from observed wire behavior; no vendor source text,
// headers, or comments are reproduced. Field numbers and types reflect the
// on-the-wire protobuf layout (interface facts) required for compatibility.
// SPDX-License-Identifier: MIT
syntax = "proto3";
package maclink.notification.v1;

enum OperationType {
  OPERATION_TYPE_UNSPECIFIED = 0;
  OPERATION_TYPE_GET = 1;
}

enum ResponseStatus {
  RESPONSE_STATUS_UNSPECIFIED = 0;
  RESPONSE_STATUS_OK = 1;
  RESPONSE_STATUS_INVALID_REQUEST = 2;
  RESPONSE_STATUS_PERMISSION_NOT_GRANTED = 3;
  RESPONSE_STATUS_NO_NOTIFICATION = 4;
  RESPONSE_STATUS_UNKNOWN_ERROR = 5;
}

message NotificationInfo {
  string key = 1;
  string title = 2;
  string text = 3;
  string big_text = 4;
  string app_name = 5;
  string package_name = 6;
  int64 post_time = 7;
  int64 timestamp = 8;
  string category = 9;
  bool is_clearable = 10;
  string sub_text = 11;
  string conversation_title = 12;
  int32 notification_class = 13;
}

message RequestMessage {
  OperationType type = 1;
  repeated string keys = 2;
  repeated int64 post_times = 3;
}

message ResponseMessage {
  ResponseStatus status = 1;
  repeated NotificationInfo notifications = 2;
}
