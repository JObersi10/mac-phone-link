// Clean-room interoperability schema for the mac-phone-link project.
// Independently authored from observed wire behavior; no vendor source text,
// headers, or comments are reproduced. Field numbers and types reflect the
// on-the-wire protobuf layout (interface facts) required for compatibility.
// SPDX-License-Identifier: MIT
syntax = "proto3";
package maclink.mirroring.v1;

message RequestPermissionMessage { string permission = 1; }
message CheckPermissionMessage { string permission = 1; string transaction_id = 2; }
message ShowPermissionMessage { string permission = 1; string transaction_id = 2; }
message LaunchSettingsMessage { string permission = 1; string transaction_id = 2; }
message PermissionStatusMessage { string status = 1; }
message CheckPermissionResultMessage { string transaction_id = 1; string status = 2; }
message ShowPermissionResultMessage { string transaction_id = 1; string status = 2; }
message LaunchSettingsResultMessage { string transaction_id = 1; string status = 2; }
