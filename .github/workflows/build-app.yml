name: Build macOS App

on:
  push:
    tags: [ "v*" ]
    branches: [ "main" ]
  pull_request:
    # Build the .app on every PR so the bundle is downloadable from the run's
    # Artifacts (Releases only get it on v* tags).
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version string for the bundle (e.g. 0.1.0)"
        required: false
        default: "0.0.0-dev"

permissions:
  contents: write   # needed to upload assets to GitHub Releases

jobs:
  build-app:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Toolchain
        run: swift --version && sw_vers

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ github.event.inputs.version }}"
          fi
          echo "version=${V:-0.0.0-dev}" >> "$GITHUB_OUTPUT"
          echo "Version: ${V:-0.0.0-dev}"

      - name: Build app (release)
        run: |
          # Single-arch (runner native). For a universal binary add
          # `--arch arm64 --arch x86_64` — that path requires full Xcode's
          # xcbuild, which the macos-latest runner has.
          swift build -c release --product PhoneLinkApp
          BIN="$(swift build -c release --product PhoneLinkApp --show-bin-path)/PhoneLinkApp"
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          file "$BIN"

      - name: Import Developer ID signing identity
        id: signing
        # Only runs when the signing secrets are configured. Imports the cert
        # into a throwaway keychain and exposes the identity name for packaging.
        # Required secrets:
        #   MACOS_CERTIFICATE        base64 of the Developer ID Application .p12
        #   MACOS_CERTIFICATE_PWD    password for that .p12
        #   MACOS_SIGN_IDENTITY      e.g. "Developer ID Application: Name (TEAMID)"
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "No signing secrets — falling back to ad-hoc signing."
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KPWD="$(uuidgen)"
          security create-keychain -p "$KPWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPWD" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PWD" \
            -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPWD" "$KEYCHAIN" >/dev/null
          # Prepend to the search list so codesign finds the identity.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "identity=$MACOS_SIGN_IDENTITY" >> "$GITHUB_OUTPUT"
          echo "Imported signing identity."

      - name: Assemble PhoneLink.app
        env:
          CODESIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          CODESIGN_ENTITLEMENTS: scripts/PhoneLink.entitlements
        run: |
          mkdir -p dist
          scripts/package-app.sh "$BIN" dist "${{ steps.ver.outputs.version }}"
          ls -lh dist

      - name: Notarize & staple
        # Only when both a real identity and notarization creds are present.
        if: steps.signing.outputs.identity != '-' && env.AC_API_KEY_ID != ''
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
        run: |
          echo "$AC_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/ac_key.p8"
          ditto -c -k --sequesterRsrc --keepParent dist/PhoneLink.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/ac_key.p8" \
            --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID" \
            --wait
          xcrun stapler staple dist/PhoneLink.app

      - name: Zip bundle for upload
        run: |
          # A .app is a directory; zipping is not a .dmg. Re-zip after any staple.
          ditto -c -k --sequesterRsrc --keepParent dist/PhoneLink.app dist/PhoneLink.app.zip
          ls -lh dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneLink-app
          path: dist/PhoneLink.app.zip
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PhoneLink.app.zip
          fail_on_unmatched_files: true
