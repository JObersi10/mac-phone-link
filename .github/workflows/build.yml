name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version || true

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build (release)
        run: swift build -c release

      - name: Run tests
        # Only the platform-agnostic targets have tests; they also run on the
        # macOS toolchain. Keep going so a test failure still yields artifacts.
        run: swift test --parallel
        continue-on-error: false

      - name: Package .app and .dmg
        run: ./scripts/package-app.sh

      - name: Upload .app bundle
        uses: actions/upload-artifact@v4
        with:
          name: PhoneLink-app
          path: build/PhoneLink.app
          if-no-files-found: error

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: mac-phone-link-dmg
          path: build/mac-phone-link.dmg
          if-no-files-found: warn

  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default package set includes the obsolete "tools" package, which
          # no longer exists and makes the action fail. Install only what's here.
          packages: 'platform-tools'

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.2 --distribution-type bin

      - name: Decode signing keystore (if configured)
        # Optional: set the ANDROID_KEYSTORE_B64 secret (base64 of your .jks) plus
        # the password/alias secrets to sign every APK with one stable key, so
        # updates install over previous ones. Without the secret, the build still
        # runs with default debug signing. See docs/ANDROID_SIGNING.md.
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/companion.jks"
            echo "COMPANION_KEYSTORE=$RUNNER_TEMP/companion.jks" >> "$GITHUB_ENV"
            echo "Signing key configured."
          else
            echo "No ANDROID_KEYSTORE_B64 secret set — using default debug signing."
          fi

      - name: Build debug APK
        working-directory: android
        env:
          COMPANION_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          COMPANION_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          COMPANION_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: companion-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
