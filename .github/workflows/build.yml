name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version || true

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build (release)
        run: swift build -c release

      - name: Run tests
        # Only the platform-agnostic targets have tests; they also run on the
        # macOS toolchain. Keep going so a test failure still yields artifacts.
        run: swift test --parallel
        continue-on-error: false

      - name: Package .app and .dmg
        run: ./scripts/package-app.sh

      - name: Upload .app bundle
        uses: actions/upload-artifact@v4
        with:
          name: PhoneLink-app
          path: build/PhoneLink.app
          if-no-files-found: error

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: mac-phone-link-dmg
          path: build/mac-phone-link.dmg
          if-no-files-found: warn

  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.2 --distribution-type bin

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: companion-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
